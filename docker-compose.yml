version: '3.4'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: english_platform_db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Password123! # M?t kh?u m?nh (Ch? hoa, th??ng, s?, k? t? ??c bi?t)
    ports:
      - "1433:1433"
    volumes:
      - sqlvolume:/var/opt/mssql

  seq:
    image: datalust/seq:latest
    container_name: english_platform_seq
    environment:
      - ACCEPT_EULA=Y
    ports:
      - "5341:80"   # UI xem log
      - "5342:5341" # Port nh?n log

volumes:
  sqlvolume: